---
layout: default
---
<section class="hero">
  <h1>{{ page.title | default: site.title }}</h1>
  <div>{{ content }}</div>
</section>

<section class="post-grid">
  {% for post in site.posts %}
  <a class="post-card" href="{{ post.url | relative_url }}">
    {% if post.image %}<img loading="lazy" src="{{ post.image }}" alt="{{ post.title | escape }}">{% endif %}
    <div class="post-card-body">
      <time>{{ post.date | date: '%Y.%m.%d' }}</time>
      <h2>{{ post.title }}</h2>
      <p>{{ post.description | strip_html | truncate: 70 }}</p>
    </div>
  </a>
  {% endfor %}
</section>
