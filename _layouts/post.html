---
layout: default
---
<article class="post">
  <header class="post-head">
    <time>{{ page.date | date: '%Y년 %m월 %d일' }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-desc">{{ page.description }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
