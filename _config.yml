title: 이번 주 공연 추천
description: KOPIS 박스오피스 기준 매주 인기 공연·뮤지컬·연극·콘서트 예매 정보를 자동으로 정리합니다.
author: Ticketpromote
lang: ko-KR

# GitHub Pages 프로젝트 사이트 기준 (https://<user>.github.io/Ticketpromote/)
# 사용자/저장소 이름이 다르면 아래 두 값을 맞춰주세요.
url: "https://ikdd7.github.io"
baseurl: "/Ticketpromote"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 빌드에서 제외 (데이터/스크립트/문서는 사이트로 발행하지 않음)
exclude:
  - scripts/
  - data/
  - config/
  - content/
  - RUNBOOK.md
  - Gemfile
  - Gemfile.lock
  - vendor/

# AdSense 등 광고 스크립트는 승인 후 _includes/custom-head.html 등에 추가
