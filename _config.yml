title: 이번 주 공연 추천
description: KOPIS 박스오피스 기준 매주 인기 공연·뮤지컬·연극·콘서트의 예매 정보·관람료·무료공연을 자동으로 정리합니다.
author: Ticketpromote
lang: ko-KR

# ── 발행 주소 ──────────────────────────────────────────────
# GitHub Pages 기본 주소(프로젝트 사이트): https://<user>.github.io/<repo>/
# 커스텀 도메인을 붙이면 url 을 도메인으로 바꾸고 baseurl 은 "" 로 비웁니다.
# (자세한 절차는 CUSTOM_DOMAIN.md 참고)
url: "https://ikdd7.github.io"
baseurl: "/loop_write"

# 깔끔한 SEO 친화 URL (예: /2026/06/13/weekly-trending/)
permalink: /:year/:month/:day/:title/

# ── 검색엔진 소유확인 (Search Console / 네이버 서치어드바이저) ──
# 발급받은 인증코드만 따옴표 안에 넣고 푸시하면 메타태그가 자동 삽입됩니다.
google_site_verification: ""   # 구글 서치콘솔 (jekyll-seo-tag가 자동 메타 생성)
naver_site_verification: ""    # 네이버 서치어드바이저

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 빌드에서 제외 (사이트로 발행하지 않을 자료)
exclude:
  - scripts/
  - data/
  - config/
  - content/
  - RUNBOOK.md
  - CUSTOM_DOMAIN.md
  - SEARCH_CONSOLE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/

# AdSense 등 광고 스크립트는 승인 후 _layouts/default.html <head> 에 삽입
